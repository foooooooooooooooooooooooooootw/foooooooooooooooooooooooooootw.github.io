<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Musical Journey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
        }

        a {
            color: #90D5FF;
        }

        /* Navbar Styles */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            padding: 0 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 1rem 0;
        }

        .menu-list {
            display: flex;
            list-style: none;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 1rem 0;
        }

        .menu-list li {
            position: relative;
        }

        .menu-list a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
        }

        .menu-list a:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .dropdown-indicator {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .has-dropdown:hover .dropdown-indicator {
            transform: rotate(180deg);
        }

        .dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 0.5rem 0;
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .has-dropdown:hover .dropdown-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .dropdown-menu li {
            width: 100%;
        }

        .dropdown-menu a {
            padding: 0.8rem 1.5rem;
            border-radius: 0;
            width: 100%;
            justify-content: flex-start;
        }

        .dropdown-menu a:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: none;
        }

        /* Mobile Navigation */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 1rem;
            }

            .menu-toggle {
                display: block;
            }

            .menu-list {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(0, 0, 0, 0.95);
                backdrop-filter: blur(15px);
                flex-direction: column;
                gap: 0;
                padding: 0;
                opacity: 0;
                visibility: hidden;
                transform: translateY(-10px);
                transition: all 0.3s ease;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }

            .menu-list.active {
                opacity: 1;
                visibility: visible;
                transform: translateY(0);
            }

            .menu-list li {
                width: 100%;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            }

            .menu-list a {
                padding: 1rem 1.5rem;
                border-radius: 0;
                justify-content: space-between;
            }

            .dropdown-menu {
                position: static;
                background: rgba(255, 255, 255, 0.05);
                border: none;
                border-radius: 0;
                box-shadow: none;
                opacity: 1;
                visibility: visible;
                transform: none;
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.3s ease;
            }

            .has-dropdown.active .dropdown-menu {
                max-height: 300px;
            }

            .dropdown-menu a {
                padding: 0.8rem 2.5rem;
                font-size: 0.9rem;
            }
        }

        .gallery-container {
            height: 100vh;
            position: relative;
            overflow: hidden;
            margin-top: 70px; /* Account for fixed navbar */
        }

        .background-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            min-height: 100%;
            z-index: -1;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease-in-out, visibility 1s ease-in-out;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .background-layer.active {
            opacity: 1;
            visibility: visible;
        }

        .psychedelic-bg {
            background: #fff;
            position: relative;
            overflow: hidden;
        }

        .psychedelic-bg::before,
        .psychedelic-bg::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse 800px 200px at 50% 0%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 800px 200px at 50% 25%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 800px 200px at 50% 50%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 800px 200px at 50% 75%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 800px 200px at 50% 100%, transparent 40%, #000 41%, #000 42%, transparent 43%);
            animation: wave-flow 12s ease-in-out infinite;
        }

        .psychedelic-bg::after {
            background: 
                radial-gradient(ellipse 600px 150px at 30% 10%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 600px 150px at 70% 35%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 600px 150px at 20% 60%, transparent 40%, #000 41%, #000 42%, transparent 43%),
                radial-gradient(ellipse 600px 150px at 80% 85%, transparent 40%, #000 41%, #000 42%, transparent 43%);
            animation: wave-flow 15s ease-in-out infinite reverse;
            opacity: 0.6;
        }

        @keyframes wave-flow {
            0%, 100% { transform: translateY(0px) scaleY(1); }
            25% { transform: translateY(-20px) scaleY(1.1); }
            50% { transform: translateY(-40px) scaleY(0.9); }
            75% { transform: translateY(-20px) scaleY(1.1); }
        }

        .illusion-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 300%;
            height: 300%;
            background-image: repeating-radial-gradient(
                circle at center,
                black 0px,
                white 6px,
                black 12px,
                white 18px,
                black 24px
            );
            animation: illusionFlow 30s linear infinite, waveSkew 12s ease-in-out infinite;
            opacity: 0; /* Changed from 0.2 to 0 - will be controlled by .active class */
            z-index: 0;
            filter: contrast(1.4) brightness(1.6);
            transform-origin: center;
        }

        @keyframes waveSkew {
            0%   { transform: scale(1) skew(0deg, 0deg); }
            25%  { transform: scale(1.02) skew(1deg, -1deg); }
            50%  { transform: scale(1.03) skew(-1.5deg, 1.5deg); }
            75%  { transform: scale(1.01) skew(0.5deg, -0.5deg); }
            100% { transform: scale(1) skew(0deg, 0deg); }
        }
        
        @keyframes illusionFlow {
            0% {
                transform: scale(1) translate(0%, 0%);
            }
            50% {
                transform: scale(1.03) translate(-1%, -1%);
            }
            100% {
                transform: scale(1) translate(0%, 0%);
            }
        }



        .punk-bg {
            background: linear-gradient(135deg, #000 0%, #333 25%, #666 50%, #000 75%),
                        repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,0,0,0.1) 10px, rgba(255,0,0,0.1) 20px);
            animation: punk-flicker 2s ease-in-out infinite alternate;
        }

        @keyframes punk-flicker {
            0%, 80% { filter: contrast(1) brightness(1); }
            85%, 95% { filter: contrast(1.2) brightness(1.1); }
        }

        .jazz-bg {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #16213e 35%, #0f3460 100%);
            position: relative;
        }

        .jazz-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="1" fill="rgba(255,215,0,0.3)"/><circle cx="80" cy="30" r="0.5" fill="rgba(255,215,0,0.2)"/><circle cx="50" cy="70" r="0.8" fill="rgba(255,215,0,0.4)"/><circle cx="30" cy="80" r="0.3" fill="rgba(255,215,0,0.3)"/><circle cx="70" cy="60" r="0.6" fill="rgba(255,215,0,0.2)"/></svg>') repeat;
            animation: jazz-sparkle 4s linear infinite;
        }

        @keyframes jazz-sparkle {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-100px); }
        }

        


        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1001; /* Higher than navbar */
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(1px);
        }

        .header {
            padding: 2rem;
            text-align: center;
            background: rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        
        /* Update the genre-navigation z-index */
        .genre-navigation {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(0,0,0,0.5);
            position: relative;
            z-index: 1001; /* Higher than navbar's z-index: 1000 */
        }

        .genre-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            font-weight: bold;
        }

        .genre-btn:hover, .genre-btn.active {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .cards-container {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            align-items: start;
            overflow-y: auto;
        }

        .card {
            line-height: 1.7;
            letter-spacing: 0.2px;
            background: rgba(50, 50, 50, 0.95); /* New: dark gray translucent background */
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(30px);
            animation: cardFadeIn 0.6s ease-out forwards;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }


        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.2s; }
        .card:nth-child(4) { animation-delay: 0.3s; }
        .card:nth-child(5) { animation-delay: 0.4s; }
        .card:nth-child(6) { animation-delay: 0.5s; }

        @keyframes cardFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .favourites {
            margin-top: 1rem;
            font-size: 0.95rem;
            color: #ddd;
        }

        .favourites ul {
            padding-left: 1.2rem;
            margin: 0.3rem 0 0;
        }

        .favourites li::marker {
            color: #4ecdc4; /* accent color */
        }

        .card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card h3 {
            font-size: 1.4rem;
            margin-bottom: 0.8rem;
            color: #fff;
        }

        .card .type {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card .description {
            line-height: 1.6;
            opacity: 0.9;
        }

        .instruments-section {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 20;
        }

        .instruments-section h4 {
            margin-bottom: 0.5rem;
            color: #4ecdc4;
        }

        .instruments-list {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2rem; }
            .genre-navigation { flex-wrap: wrap; }
            .cards-container { grid-template-columns: 1fr; padding: 1rem; }
            .instruments-section { 
                position: static; 
                margin: 1rem; 
                text-align: center; 
            }

            .background-layer {
                height: 100%;
                min-height: 100vh;
                position: absolute;
            }
        }

        #embersCanvas {
            position: fixed;
            top: 0; 
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: black;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        #embersCanvas.active {
            opacity: 1;
        }
    </style>
</head>

        function showGenre(genre) {
            // Update background
            document.querySelectorAll('.background-layer').forEach(bg => {
                bg.classList.remove('active');
            });
            document.querySelector(`[data-genre="${genre}"]`).classList.add('active');

            // Update embers canvas visibility
            const embersCanvas = document.getElementById('embersCanvas');
            if (genre === 'rock') {
                embersCanvas.classList.add('active');
            } else {
                embersCanvas.classList.remove('active');
            }

            // Update navigation
            document.querySelectorAll('.genre-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-genre="${genre}"].genre-btn`).classList.add('active');

            // Update cards
            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            
            setTimeout(() => {
                musicData[genre].forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${item.title}</h3>
                        <div class="type">${item.type}</div>
                        <div class="description">${item.description}</div>
                        ${item.fav ? `
                            <div class="favourites">
                                <strong>Favourite Songs:</strong>
                                <ul>${item.fav.map(song => `<li>${song}</li>`).join('')}</ul>
                            </div>
                        ` : ''}
                    `;
                    container.appendChild(card);
                });
            }, 300);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            showGenre('psychedelic');

            // Add event listeners for genre buttons
            document.querySelectorAll('.genre-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    showGenre(btn.dataset.genre);
                });
            });

            // Mobile menu toggle
            const menuToggle = document.querySelector('.menu-toggle');
            const menuList = document.querySelector('.menu-list');
            
            menuToggle.addEventListener('click', () => {
                menuList.classList.toggle('active');
            });

            // Mobile dropdown toggle
            document.querySelectorAll('.has-dropdown > a').forEach(link => {
                link.addEventListener('click', (e) => {
                    if (window.innerWidth <= 768) {
                        e.preventDefault();
                        const parent = link.parentElement;
                        parent.classList.toggle('active');
                    }
                });
            });

            // Close mobile menu when clicking outside
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.navbar')) {
                    menuList.classList.remove('active');
                    document.querySelectorAll('.has-dropdown').forEach(item => {
                        item.classList.remove('active');
                    });
                }
            });
        });

    const canvas = document.getElementById('embersCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resizeCanvas() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Ember particle object
    class Ember {
        constructor() {
            this.reset();
        }

        reset() {
            this.x = Math.random() * width;
            this.y = height + Math.random() * 100;
            this.radius = Math.random() * 2 + 1;
            this.speedY = Math.random() * 0.5 + 0.5;
            this.speedX = Math.random() * 0.4 - 0.2;
            this.alpha = Math.random() * 0.6 + 0.2;
            this.color = `rgba(${200 + Math.random()*55}, ${30 + Math.random()*50}, 0, ${this.alpha})`;
        }

        update() {
            this.y -= this.speedY;
            this.x += this.speedX;
            if (this.y < -10 || this.x < -10 || this.x > width + 10) {
                this.reset();
            }
        }

        draw(ctx) {
            ctx.beginPath();
            ctx.fillStyle = this.color;
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Create embers
    const embers = [];
    const EMBER_COUNT = 150;
    for (let i = 0; i < EMBER_COUNT; i++) {
        embers.push(new Ember());
    }

    // Animate
    function animate() {
        ctx.clearRect(0, 0, width, height);
        embers.forEach(e => {
            e.update();
            e.draw(ctx);
        });
        requestAnimationFrame(animate);
    }
    animate();
    </script>
</body>
