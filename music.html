<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Orbital Radio · Atlas No. 04</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Space+Mono:wght@400;700&display=swap' rel='stylesheet'>
<style>
:root{
--cream:#F7F1E3; --paper:#FBF7EC; --ink:#212A45; --ink-soft:#565E7A;
--navy:#1B2340; --navy-deep:#141B2E;
--cyan:#1E9AAF; --cyan-bright:#6FD6DF; --cyan-wash:#E6F1F4;
--pink:#F04E7E; --pink-wash:#FBE0EA;
--blue:#2F6BFF; --purple:#7B5CF2; --purple-wash:#ECE7FD;
--gold:#C08B2B; --gold-bright:#F2B416; --gold-wash:#FBF1D3;
--ember:#E2421F;
--line:#212A45;
--ease:cubic-bezier(.22,.7,.2,1);
--mono:'Space Mono',monospace; --serif:'Cormorant Garamond',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background-color:var(--cream); color:var(--ink); font-family:var(--serif); line-height:1.55; font-size:17px; min-height:100vh; overflow-x:hidden;
background-image:radial-gradient(rgba(27,31,51,0.05) 1px, transparent 1px), radial-gradient(rgba(30,154,175,0.05) 1px, transparent 1px);
background-size:24px 24px, 56px 56px; background-position:0 0, 14px 28px; -webkit-font-smoothing:antialiased}
::selection{background:var(--pink); color:var(--cream)}
a{color:inherit; text-decoration:none}
:focus-visible{outline:3px solid var(--cyan); outline-offset:3px}
.sky :focus-visible,.footer :focus-visible,.stage :focus-visible{outline-color:var(--gold-bright)}
.wrap{width:min(1100px, calc(100% - 3rem)); margin:0 auto}
.mono{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; text-transform:uppercase}
.skip{position:absolute; left:-999px; top:0; background:var(--ink); color:var(--cream); padding:.6rem 1rem; z-index:100; font-family:var(--mono); font-size:.72rem}
.skip:focus{left:0}
.spark{width:1em; height:1em; display:inline-block}

/* --- top bar (same as the other pages) --- */
.topbar{position:sticky; top:0; z-index:30; background:rgba(247,241,227,.92); backdrop-filter:blur(8px); padding:.85rem 0; border-bottom:1px solid rgba(27,31,51,.16)}
.topbar-inner{display:flex; justify-content:space-between; align-items:center; gap:1rem; flex-wrap:wrap}
.brand{font-size:1.1rem; font-weight:700; letter-spacing:.02em; display:flex; align-items:center; gap:.4rem}
.brand span{color:var(--pink); font-family:var(--mono); font-size:.7rem; letter-spacing:.14em}
nav{display:flex; gap:.6rem; flex-wrap:wrap}
nav a{font-family:var(--mono); font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:999px; padding:.45rem .9rem; transition:background-color .2s, color .2s, border-color .2s, transform .2s}
nav a:hover{background:var(--pink); color:var(--cream); border-color:var(--pink); transform:translateY(-1px)}
nav a[aria-current='page']{background:var(--ink); color:var(--cream)}

/* --- hero --- */
.sky{position:relative; background:var(--navy-deep); color:var(--cream); overflow:hidden; border-bottom:1.5px solid var(--line)}
.stars{position:absolute; inset:0; pointer-events:none; background-image:radial-gradient(1.3px 1.3px at 14px 24px,#fff,transparent 60%), radial-gradient(1px 1px at 96px 70px,rgba(255,255,255,.8),transparent 60%), radial-gradient(1.6px 1.6px at 170px 140px,#F2B416,transparent 60%), radial-gradient(1px 1px at 230px 36px,rgba(255,255,255,.7),transparent 60%), radial-gradient(1.2px 1.2px at 60px 190px,#6FD6DF,transparent 60%), radial-gradient(1px 1px at 270px 210px,rgba(255,255,255,.8),transparent 60%); background-size:300px 260px; animation:twinkle 6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.55} to{opacity:1}}
.hero{position:relative; z-index:1; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:2.4rem; align-items:center; padding:3.8rem 0 3.6rem}
.overline{display:flex; align-items:center; gap:.7rem; color:var(--cyan-bright); margin-bottom:1.2rem}
.overline .spark{width:14px; height:14px}
.overline i{flex:0 0 48px; height:1px; background:var(--cyan-bright); opacity:.6}
h1{font-size:clamp(2.8rem,6.4vw,5rem); font-weight:300; line-height:.98; letter-spacing:.02em; text-transform:uppercase; overflow-wrap:anywhere}
h1 b{font-weight:600; color:var(--gold-bright)}
h1 em{display:block; font-style:italic; font-weight:400; text-transform:none; letter-spacing:0; color:var(--cream); opacity:.88; font-size:.38em; margin-top:.9em; line-height:1.25}
.instr{margin-top:1.8rem}
.instr .lab{display:block; font-family:var(--mono); font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; color:var(--cyan-bright); margin-bottom:.6rem}
.instr ul{list-style:none; display:flex; flex-wrap:wrap; gap:.5rem}
.instr li{font-family:var(--mono); font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; border:1px solid rgba(247,241,227,.45); border-radius:999px; padding:.4rem .85rem}
.instr li:nth-child(1){border-color:var(--pink); color:var(--pink-wash)}
.instr li:nth-child(2){border-color:var(--gold-bright); color:var(--gold-wash)}
.instr li:nth-child(3){border-color:var(--cyan-bright); color:var(--cyan-wash)}
.instr li:nth-child(4){border-color:var(--purple); color:var(--purple-wash)}
.disc{position:relative; width:min(380px,100%); aspect-ratio:1; margin:0 auto}
.disc svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.disc .rec{transform-origin:150px 150px; animation:spin 9s linear infinite}
.disc .orb{transform-origin:150px 150px; animation:spin 70s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}

/* --- the stage: one backdrop per genre --- */
.stage{position:relative; overflow:hidden; background:var(--navy-deep); isolation:isolate; border-bottom:1.5px solid var(--line)}
.bg{position:absolute; inset:0; z-index:-1; opacity:0; visibility:hidden; transition:opacity 1s ease-in-out, visibility 1s; pointer-events:none; will-change:opacity}
.bg.on{opacity:1; visibility:visible}
.bg:not(.on),.bg:not(.on)::before,.bg:not(.on)::after{animation-play-state:paused}
#psyCanvas,#emberCanvas{position:absolute; left:0; top:0; width:100%; display:block}
.bg-punk{background:
 radial-gradient(circle, rgba(20,27,46,.34) 1.5px, transparent 2px) 0 0/11px 11px,
 repeating-linear-gradient(-45deg, transparent 0 26px, rgba(20,27,46,.11) 26px 52px),
 var(--pink); animation:punkdrift 14s linear infinite}
@keyframes punkdrift{to{background-position:110px 0, 0 0, 0 0}}
.bg-punk::before,.bg-punk::after{content:''; position:absolute; left:0; right:0; height:16px; background:repeating-linear-gradient(-45deg, var(--navy-deep) 0 14px, var(--gold-bright) 14px 28px)}
.bg-punk::before{top:0} .bg-punk::after{bottom:0}
.bg-jazz{background:linear-gradient(180deg,#141B2E 0%,#1f1f48 55%,#3a2350 100%)}
.bg-jazz::before{content:''; position:absolute; left:50%; top:112%; width:260vmax; height:260vmax; margin:-130vmax 0 0 -130vmax; background:repeating-conic-gradient(rgba(242,180,22,.11) 0 5deg, transparent 5deg 10deg); animation:spin 260s linear infinite}
.bg-jazz::after{content:''; position:absolute; inset:0; background:
 repeating-radial-gradient(circle at 50% 112%, transparent 0 46px, rgba(242,180,22,.4) 46px 48px),
 radial-gradient(1.4px 1.4px at 40px 60px,#F2B416,transparent 60%), radial-gradient(1px 1px at 150px 120px,#fff,transparent 60%), radial-gradient(1.2px 1.2px at 220px 30px,#6FD6DF,transparent 60%);
 background-size:auto,260px 200px,260px 200px,260px 200px; animation:glint 5s ease-in-out infinite alternate}
@keyframes glint{from{opacity:.65} to{opacity:1}}
.bg-rock{background:linear-gradient(0deg,#7a1a10 0%,#3a0f12 24%,#14101c 62%,#0a0a12 100%)}
.bg-rock::before{content:''; position:absolute; left:-10%; right:-10%; bottom:-6%; height:34%; background:radial-gradient(ellipse at 50% 100%, rgba(255,120,40,.55), transparent 70%); filter:blur(8px); animation:glint 3.5s ease-in-out infinite alternate}

.stage-in{position:relative; padding:2.6rem 0 4rem}
.tabs-wrap{display:flex; flex-direction:column; align-items:center; gap:.7rem; margin-bottom:2.2rem}
.tabs-label{font-family:var(--mono); font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; padding:.3rem .8rem; border-radius:999px; background:rgba(20,27,46,.72); color:var(--cyan-bright)}
.tabs{display:flex; flex-wrap:wrap; justify-content:center; gap:.4rem; padding:.45rem; background:var(--paper); border:1.5px solid var(--line); border-radius:999px; box-shadow:0 10px 30px -14px rgba(0,0,0,.6)}
.tab{font-family:var(--mono); font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; padding:.6rem 1.2rem; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--ink); cursor:pointer; transition:background-color .2s, color .2s, transform .2s}
.tab:hover{background:var(--cream); transform:translateY(-1px)}
.tab[aria-selected='true']{background:var(--acc,var(--ink)); color:var(--cream); border-color:var(--line)}
.stage[data-genre='psychedelic']{--acc:var(--purple)}
.stage[data-genre='punk']{--acc:var(--navy)}
.stage[data-genre='jazz']{--acc:var(--gold)}
.stage[data-genre='rock']{--acc:var(--ember)}

.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:1.4rem; align-items:start; transition:opacity .22s ease, transform .22s ease, height .5s var(--ease)}
.cards.swap{opacity:0; transform:translateY(10px)}
.card{position:relative; min-width:0; background:var(--paper); border:1.5px solid var(--line); border-radius:2rem; padding:1.6rem 1.6rem 1.5rem; box-shadow:0 18px 36px -22px rgba(0,0,0,.65); animation:rise .8s var(--ease) backwards; animation-delay:calc(var(--i,0) * 80ms + 60ms); transition:transform .4s var(--ease), box-shadow .4s var(--ease)}
.card:hover{transform:translateY(-5px); box-shadow:0 26px 40px -22px rgba(0,0,0,.7)}
@keyframes rise{from{opacity:0; transform:translateY(22px) scale(.985)}}
.card::before{content:''; position:absolute; left:1.6rem; top:-1.5px; width:56px; height:5px; border-radius:0 0 6px 6px; background:var(--acc)}
.card .no{font-family:var(--mono); font-size:.62rem; letter-spacing:.2em; color:var(--ink-soft); display:flex; align-items:center; gap:.5rem; margin-bottom:.5rem}
.card .no::before{content:'●'; color:var(--acc); font-size:.7rem}
.card h3{font-size:1.8rem; font-weight:500; line-height:1.1; margin-bottom:.6rem; overflow-wrap:anywhere}
.card .type{display:inline-block; font-family:var(--mono); font-size:.6rem; letter-spacing:.12em; text-transform:uppercase; padding:.28rem .7rem; border-radius:999px; background:var(--acc); color:var(--cream); margin-bottom:.9rem}
.card .desc{font-size:1.1rem; color:var(--ink-soft); line-height:1.55}
.deck{margin-top:1.2rem; background:linear-gradient(180deg,#232c4c,#171d36); border:1.5px solid var(--line); border-radius:1.5rem; padding:.7rem .8rem .8rem; color:var(--cream); box-shadow:inset 0 1px 0 rgba(247,241,227,.14), inset 0 -10px 18px -12px rgba(0,0,0,.6)}
.deck-top{display:flex; align-items:center; justify-content:space-between; gap:.6rem; margin-bottom:.55rem; font-family:var(--mono); font-size:.52rem; letter-spacing:.22em; text-transform:uppercase; color:rgba(247,241,227,.6)}
.deck-top i{width:9px; height:9px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#fff,#9aa3b8 55%,#4b5268); box-shadow:0 0 0 1px rgba(0,0,0,.5); flex:none; position:relative}
.deck-top i::after{content:''; position:absolute; left:50%; top:1px; bottom:1px; width:1px; background:rgba(0,0,0,.55); transform:rotate(35deg)}
.lcd{display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:.7rem; background:#0c1020; border:1.5px solid #070a14; border-radius:.9rem; padding:.55rem .7rem; box-shadow:inset 0 3px 10px rgba(0,0,0,.7), 0 1px 0 rgba(247,241,227,.12)}
.reels{display:flex; gap:.25rem}
.reel{width:26px; height:26px; display:block}
.reel g{transform-origin:13px 13px}
.deck.playing .reel g{animation:spin 1.6s linear infinite}
.lcd-text{min-width:0; font-family:var(--mono); color:#FFC24A; text-shadow:0 0 7px rgba(255,170,30,.55)}
.lcd-st{display:block; font-size:.54rem; letter-spacing:.18em; text-transform:uppercase; opacity:.8}
.lcd-title{display:block; font-size:.74rem; letter-spacing:.04em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:.1rem}
.eq{display:flex; align-items:flex-end; gap:2px; height:22px}
.eq b{display:block; width:3px; height:4px; background:#FFC24A; border-radius:1px; box-shadow:0 0 5px rgba(255,170,30,.6); transition:height .2s}
.deck.playing .eq b{animation:eqb .9s ease-in-out infinite alternate}
.eq b:nth-child(2){animation-delay:-.25s!important} .eq b:nth-child(3){animation-delay:-.5s!important} .eq b:nth-child(4){animation-delay:-.15s!important} .eq b:nth-child(5){animation-delay:-.7s!important}
@keyframes eqb{0%{height:4px} 50%{height:20px} 100%{height:9px}}
.tracks{list-style:none; position:relative; margin:.6rem 0 .55rem; max-height:14rem; overflow-y:auto; display:flex; flex-direction:column; gap:.25rem; padding-right:.2rem; scrollbar-width:thin; scrollbar-color:rgba(247,241,227,.35) transparent}
.track{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:.4rem; border-radius:.8rem; background:rgba(247,241,227,.06); transition:background-color .25s ease, box-shadow .25s ease}
.track:hover{background:rgba(247,241,227,.12)}
.track.on{background:rgba(255,194,74,.16); box-shadow:inset 0 0 0 1px rgba(255,194,74,.5)}
.cue{display:flex; align-items:center; gap:.6rem; min-width:0; text-align:left; background:none; border:0; color:inherit; cursor:pointer; padding:.45rem .3rem .45rem .65rem; font-family:var(--mono); font-size:.64rem; letter-spacing:.03em}
.tn{flex:none; color:var(--cyan-bright); opacity:.85}
.track.on .tn{color:#FFC24A}
.tt{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.play{display:grid; place-items:center; width:28px; height:28px; margin-right:.3rem; border-radius:50%; background:var(--cream); color:var(--ink); border:1px solid rgba(0,0,0,.5); box-shadow:0 2px 0 rgba(0,0,0,.5); transition:background-color .15s, transform .15s}
.play svg{width:11px; height:11px; margin-left:1px}
a.play:hover{background:var(--pink); color:var(--cream); transform:scale(1.08)}
a.play:active{transform:translateY(1px); box-shadow:none}
.play.off{background:transparent; color:rgba(247,241,227,.28); border-color:rgba(247,241,227,.2); box-shadow:none}
.ctrl{display:flex; align-items:center; gap:.45rem; border-top:1px solid rgba(247,241,227,.14); padding-top:.65rem}
.tbtn{display:grid; place-items:center; width:32px; height:28px; border-radius:.55rem; background:var(--cream); color:var(--ink); border:1px solid rgba(0,0,0,.5); box-shadow:0 2px 0 rgba(0,0,0,.5); cursor:pointer; transition:background-color .15s, transform .1s}
.tbtn svg{width:12px; height:12px}
.tbtn:hover{background:var(--gold-bright)}
.tbtn:active{transform:translateY(2px); box-shadow:none}
.tbtn.go{width:44px; background:var(--pink); color:var(--cream)}
.tbtn.go:hover{background:#ff7aa0}
.ctrl .sp{flex:1}
.knob{width:26px; height:26px; border-radius:50%; background:conic-gradient(from 0deg,#cfd5de,#6f7686,#e7ebf1,#5b6272,#cfd5de); border:1px solid #070a14; box-shadow:0 2px 3px rgba(0,0,0,.6); position:relative; transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.knob::after{content:''; position:absolute; left:50%; top:2px; width:2px; height:8px; margin-left:-1px; background:var(--pink); border-radius:1px}
.deck.nolink .lcd-st{color:#ff8a6a}
.embed{height:0; opacity:0; overflow:hidden; border-radius:12px; transition:height .4s var(--ease), opacity .3s ease, margin .4s var(--ease)}
.embed.open{height:var(--eh,80px); opacity:1; margin-top:.6rem}
.embed iframe{display:block; width:100%; height:100%; border:0; border-radius:12px; color-scheme:normal; background:#000}

/* --- listen-on picker: one control for the whole page --- */
.listen{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:.6rem .8rem; margin-top:.1rem}
.pick{display:flex; align-items:center; gap:.15rem; padding:.28rem; background:rgba(251,247,236,.95); border:1.5px solid var(--line); border-radius:999px; box-shadow:0 8px 22px -14px rgba(0,0,0,.6)}
.pick-l{font-family:var(--mono); font-size:.54rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); padding:0 .45rem 0 .7rem; white-space:nowrap}
.pick button{font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; padding:.42rem .8rem; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--ink); cursor:pointer; transition:background-color .3s var(--ease), color .3s var(--ease), opacity .3s}
.pick button:hover:not([aria-disabled='true']):not([aria-checked='true']){background:var(--cream)}
.pick button[aria-checked='true']{background:var(--acc,var(--ink)); color:var(--cream)}
.pick button[aria-disabled='true']{opacity:.3; cursor:not-allowed}
.lcd-hint{display:block; margin-top:.25rem; padding:0; font:inherit; font-size:.54rem; letter-spacing:.1em; text-transform:uppercase; color:#ffd88a; background:none; border:0; border-bottom:1px dashed currentColor; cursor:pointer; text-shadow:none}
.lcd-hint[hidden]{display:none}

.footer{border-top:1.5px solid var(--line); background:var(--navy-deep); color:var(--cream); padding:1.5rem 0}
.footer-inner{display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap}
.footer .brand{color:var(--cream); font-size:1rem}

@media (max-width:900px){
.hero{grid-template-columns:minmax(0,1fr); text-align:center; padding:2.6rem 0 2.4rem; gap:1.8rem}
.overline{justify-content:center}
.instr ul{justify-content:center}
.disc{width:min(260px,70%); order:-1}
.topbar-inner{flex-direction:column; gap:.8rem}
nav{justify-content:center}
}
@media (max-width:560px){
.tabs{border-radius:1.6rem; width:100%}
.tab{flex:1 1 calc(50% - .4rem); text-align:center; padding:.6rem .6rem}
.card h3{font-size:1.6rem}
.pick{border-radius:1.4rem; flex-wrap:wrap; justify-content:center; width:100%}
.pick-l{width:100%; text-align:center; padding:.25rem 0 .1rem}
}
@media (prefers-reduced-motion:reduce){
.pick button{transition:none}
html{scroll-behavior:auto}
.card{opacity:1; transform:none; animation:none}
.stars,.disc .rec,.disc .orb,.bg-punk,.bg-jazz::before,.bg-jazz::after,.bg-rock::before{animation:none}
}
</style>

</div>

<path id='lblpath' d='M150 150 m-30 0 a30 30 0 1 1 60 0 a30 30 0 1 1 -60 0'/>
</defs>

<circle cx='150' cy='150' r='128' fill='#0c1020' stroke='#F7F1E3' stroke-opacity='.35' stroke-width='1.2'/>
<g fill='none' stroke='#F7F1E3' stroke-opacity='.09'>
<circle cx='150' cy='150' r='122'/><circle cx='150' cy='150' r='115'/><circle cx='150' cy='150' r='108'/><circle cx='150' cy='150' r='101'/><circle cx='150' cy='150' r='94'/><circle cx='150' cy='150' r='87'/><circle cx='150' cy='150' r='80'/><circle cx='150' cy='150' r='73'/><circle cx='150' cy='150' r='66'/>
</g>

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- streaming services ---------- */
const SERVICES = [
  {key:'youtube', label:'YouTube'},
  {key:'spotify', label:'Spotify'},
  {key:'apple',   label:'Apple Music'},
  {key:'deezer',  label:'Deezer'},
  {key:'tidal',   label:'Tidal'}
];

const spRe = /open\.spotify\.com\/(?:intl-[a-z-]+\/)?(track|album|artist|playlist|episode|show)\/([A-Za-z0-9]{22})|^spotify:(track|album|artist|playlist|episode|show):([A-Za-z0-9]{22})$/;
const spParse = href => { const m = spRe.exec((href || '').trim()); return m ? {type: m[1] || m[3], id: m[2] || m[4]} : null; };
const spUrl = s => `https://open.spotify.com/${s.type}/${s.id}`;
const ytId = href => { const m = /(?:youtu\.be\/|v[=/])([\w-]{6,})/.exec(href || ''); return m ? m[1] : null; };
const qEnc  = q => encodeURIComponent(q.replace(/\s+/g,' ').trim());

function svcHref(key, yt, dq){
  switch(key){
    case 'youtube': return yt || `https://www.youtube.com/results?search_query=${qEnc(dq)}`;
    case 'spotify': return `https://open.spotify.com/search/${qEnc(dq)}`;
    case 'apple':   return `https://music.apple.com/us/search?term=${qEnc(dq)}`;
    case 'deezer':  return `https://www.deezer.com/search/${qEnc(dq)}`;
    case 'tidal':   return `https://tidal.com/search/query?query=${encodeURIComponent(dq)}`;
  }
  return null;
}

const stage = document.getElementById('stage');
const cardsEl = document.getElementById('cards');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let current = 'psychedelic';
let clock = 0;


const escA = s => esc(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const ICON = {
  play:"<svg viewBox='0 0 12 12' aria-hidden='true'><path d='M2 1l9 5-9 5z' fill='currentColor'/></svg>",
  prev:"<svg viewBox='0 0 12 12' aria-hidden='true'><path d='M1 1h1.6v10H1zM11 1v10L3.6 6z' fill='currentColor'/></svg>",
  next:"<svg viewBox='0 0 12 12' aria-hidden='true'><path d='M9.4 1H11v10H9.4zM1 1l7.4 5L1 11z' fill='currentColor'/></svg>"
};
const REEL = "<svg class='reel' viewBox='0 0 26 26' aria-hidden='true'><circle cx='13' cy='13' r='12' fill='#1b2340' stroke='#FFC24A' stroke-opacity='.7'/><g><circle cx='13' cy='13' r='4' fill='none' stroke='#FFC24A'/><path d='M13 3v6M13 17v6M3 13h6M17 13h6' stroke='#FFC24A' stroke-width='1.6'/></g></svg>";
function parseFav(f){
  /* a favourite is either an <a href> string, or {title, yt, spotify} */
  if(f && typeof f === 'object') return { title: String(f.title || '').trim(), yt: f.yt || '', sp: spParse(f.spotify || '') };
  const d = document.createElement('div'); d.innerHTML = f;
  const a = d.querySelector('a'), href = a ? (a.getAttribute('href') || '') : '', sp = spParse(href);
  return { title: d.textContent.trim(), yt: sp ? '' : href, sp };
}
function buildDeck(favs){
  const tracks = favs.map(parseFav);
  const rows = tracks.map((t,i) => { const link = t.yt || (t.sp ? spUrl(t.sp) : ''); return `<li class='track' data-title="${escA(t.title)}" data-yt="${escA(t.yt)}" data-sp="${t.sp ? t.sp.type + ':' + t.sp.id : ''}">
<button class='cue' type='button' aria-label="Cue ${escA(t.title)}"><span class='tn'>${String(i+1).padStart(2,'0')}</span><span class='tt'>${esc(t.title)}</span></button>
${link ? `<a class='play' href="${escA(link)}" target='_blank' rel='noopener' aria-label="Play ${escA(t.title)}">${ICON.play}</a>` : `<span class='play off' title='No link yet' aria-hidden='true'>${ICON.play}</span>`}
</li>`; }).join('');
  return `<div class='deck' data-n='${tracks.length}'>
<div class='deck-top'><i></i><span>Atlas Hi-Fi &middot; Fav. songs</span><i></i></div>
<div class='lcd'><div class='reels'>${REEL}${REEL}</div><div class='lcd-text'><span class='lcd-st'></span><span class='lcd-title'></span><button class='lcd-hint' type='button' hidden></button></div><div class='eq' aria-hidden='true'><b></b><b></b><b></b><b></b><b></b></div></div>
<ol class='tracks'>${rows}</ol>
<div class='ctrl'><button class='tbtn' type='button' data-t='prev' aria-label='Previous track'>${ICON.prev}</button><button class='tbtn go' type='button' data-t='play' aria-label='Play cued track on your preferred service'>${ICON.play}</button><button class='tbtn' type='button' data-t='next' aria-label='Next track'>${ICON.next}</button><span class='sp'></span><span class='knob' aria-hidden='true'></span></div>
</div>`;
}
const pad2 = n => String(n).padStart(2,'0');
function setCue(deck, i, quiet){
  const rows = [...deck.querySelectorAll('.track')]; if(!rows.length) return;
  i = (i + rows.length) % rows.length;
  deck.dataset.cue = i;
  rows.forEach((r,k) => r.classList.toggle('on', k === i));
  const r = rows[i], ol = deck.querySelector('.tracks');
  if(!quiet) ol.scrollTo({top: r.offsetTop - ol.clientHeight/2 + r.offsetHeight/2, behavior: reduce ? 'auto' : 'smooth'});
  const lt = deck.querySelector('.lcd-title');
  if(lt.textContent !== r.dataset.title){ lt.textContent = r.dataset.title; if(!quiet && !reduce && lt.animate) lt.animate([{opacity:0, transform:'translateY(3px)'},{opacity:1, transform:'none'}], {duration:260, easing:'ease-out'}); }
  deck.classList.remove('nolink');
  if(!deck.classList.contains('playing')) deck.querySelector('.lcd-st').textContent = `Cued ${pad2(i+1)}/${pad2(rows.length)} · ${svcTag()}`;
  deck.querySelector('.knob').style.transform = `rotate(${-120 + i * (240 / Math.max(1, rows.length-1))}deg)`;
}
function svcHrefFor(deck, row, key){
  const dq = `${deck.dataset.artist || ''} ${row.dataset.title}`.trim();
  if(key === 'spotify' && row.dataset.sp){ const [type,id] = row.dataset.sp.split(':'); return spUrl({type,id}); }
  return svcHref(key, key === 'youtube' ? row.dataset.yt : null, dq);
}

/* ---------- one global choice: which service, and how to open it ---------- */
const label = k => SERVICES.find(s => s.key === k).label;
const CAN = { youtube:{page:1,app:0,tab:1}, spotify:{page:1,app:1,tab:1}, apple:{page:0,app:1,tab:1}, deezer:{page:0,app:0,tab:1}, tidal:{page:0,app:0,tab:1} };
let svc = 'youtube', how = 'page';
try{ const sv = JSON.parse(localStorage.getItem('orbital.listen') || 'null'); if(sv && CAN[sv.svc]){ svc = sv.svc; if(['page','app','tab'].includes(sv.how)) how = sv.how; } }catch(e){}
const saveListen = () => { try{ localStorage.setItem('orbital.listen', JSON.stringify({svc, how})); }catch(e){} };
const effHow = () => CAN[svc][how] ? how : 'tab';          /* the chosen way, unless this service can't do it */
function svcTag(){ return label(svc).toUpperCase() + (effHow() === 'app' ? ' APP' : ''); }
function syncListen(){
  const m = effHow();
  document.querySelectorAll('.pick [data-svc]').forEach(b => { const on = b.dataset.svc === svc; b.setAttribute('aria-checked', on); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll('.pick [data-how]').forEach(b => { const k = b.dataset.how, on = k === m; b.setAttribute('aria-checked', on); b.setAttribute('aria-disabled', CAN[svc][k] ? 'false' : 'true'); b.tabIndex = on ? 0 : -1; });
  document.querySelectorAll('.deck:not(.playing)').forEach(d => setCue(d, +d.dataset.cue || 0, true));
}
function initListen(){
  const root = document.querySelector('.listen');
  root.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.svc) svc = b.dataset.svc;
    else if(b.dataset.how){ if(b.getAttribute('aria-disabled') === 'true') return; how = b.dataset.how; }
    saveListen(); syncListen();
  });
  root.addEventListener('keydown', e => {
    if(!/^Arrow/.test(e.key)) return;
    const g = e.target.closest('[role=radiogroup]'); if(!g) return;
    const bs = [...g.querySelectorAll('button:not([aria-disabled=true])')], i = bs.indexOf(e.target); if(i < 0) return;
    e.preventDefault(); const n = bs[(i + (/Right|Down/.test(e.key) ? 1 : -1) + bs.length) % bs.length]; n.focus(); n.click();
  });
  syncListen();
}

/* what should happen for this track, given the service + how */
function planFor(deck, row){
  const m = effHow(), dq = `${deck.dataset.artist || ''} ${row.dataset.title}`.trim(), q = encodeURIComponent(dq.replace(/\s+/g,' '));
  const sp = row.dataset.sp ? row.dataset.sp.split(':') : null, yid = ytId(row.dataset.yt);
  if(m === 'page'){
    if(svc === 'youtube' && yid) return {kind:'embed', title:'YouTube player', h:'170px', allow:'autoplay; encrypted-media; picture-in-picture; fullscreen', src:`https://www.youtube-nocookie.com/embed/${yid}?autoplay=1&rel=0&playsinline=1`};
    if(svc === 'spotify' && sp) return {kind:'embed', title:'Spotify player', h:(sp[0] === 'track' || sp[0] === 'episode') ? '80px' : '152px', allow:'autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture', src:`https://open.spotify.com/embed/${sp[0]}/${sp[1]}?utm_source=generator&theme=0`};
  }
  if(m === 'app'){
    if(svc === 'spotify') return {kind:'app', web: svcHrefFor(deck,row,svc), uri: sp ? `spotify:${sp[0]}:${sp[1]}` : `spotify:search:${q}`};
    if(svc === 'apple')   return {kind:'app', web: svcHrefFor(deck,row,svc), uri: `music://music.apple.com/us/search?term=${q}`};
  }
  return {kind:'tab', href: svcHrefFor(deck,row,svc)};
}

function openEmbed(deck, p){
  let box = deck.querySelector('.embed');
  if(!box){ box = document.createElement('div'); box.className = 'embed'; deck.append(box); }
  box.style.setProperty('--eh', p.h);
  box.innerHTML = `<iframe title='${p.title}' src='${p.src}' allow='${p.allow}' allowfullscreen loading='lazy'></iframe>`;
  requestAnimationFrame(() => box.classList.add('open'));
}
function closeEmbed(deck){
  const b = deck.querySelector('.embed'); if(!b) return;
  b.classList.remove('open');
  setTimeout(() => { if(!b.classList.contains('open')) b.remove(); }, 450);
}
function stopDeck(deck){
  clearTimeout(deck._t); clearTimeout(deck._h); deck.classList.remove('playing'); closeEmbed(deck);
  const h = deck.querySelector('.lcd-hint'); if(h) h.hidden = true;
}
/* a custom-scheme link (spotify:…) hands off to the installed app. Browsers can't tell us whether one exists,
   so if the page never loses focus we offer a "web instead" link on the LCD. */
function launchApp(deck, p){
  let left = false; const mark = () => { left = true; };
  window.addEventListener('blur', mark, {once:true}); document.addEventListener('visibilitychange', mark, {once:true});
  const f = document.createElement('iframe'); f.style.display = 'none'; f.src = p.uri; document.body.append(f); setTimeout(() => f.remove(), 1500);
  clearTimeout(deck._h);
  deck._h = setTimeout(() => {
    window.removeEventListener('blur', mark); document.removeEventListener('visibilitychange', mark);
    if(left) return; const h = deck.querySelector('.lcd-hint'); h._web = p.web; h.textContent = 'No app? Open on the web ↗'; h.hidden = false;
  }, 2200);
}
function playDeck(deck, i){
  setCue(deck, i);
  const r = deck.querySelectorAll('.track')[+deck.dataset.cue], p = planFor(deck, r), st = deck.querySelector('.lcd-st');
  document.querySelectorAll('.deck.playing').forEach(d => { if(d !== deck){ stopDeck(d); setCue(d, +d.dataset.cue, true); } });
  clearTimeout(deck._t); clearTimeout(deck._h); deck.querySelector('.lcd-hint').hidden = true;
  if(p.kind === 'embed'){ openEmbed(deck, p); deck.classList.add('playing'); st.textContent = `▶ ${label(svc)} · in page`; return; }
  closeEmbed(deck); deck.classList.add('playing');
  if(p.kind === 'app'){ st.textContent = `▶ ${label(svc)} · app`; launchApp(deck, p); }
  else { st.textContent = `▶ ${label(svc)} ↗`; window.open(p.href, '_blank', 'noopener'); }
  deck._t = setTimeout(() => { deck.classList.remove('playing'); setCue(deck, +deck.dataset.cue, true); }, 8000);
}

cardsEl.addEventListener('click', e => {
  const deck = e.target.closest('.deck'); if(!deck) return;
  const hint = e.target.closest('.lcd-hint');
  if(hint){ window.open(hint._web, '_blank', 'noopener'); hint.hidden = true; return; }
  const cur = +deck.dataset.cue || 0;
  const row = e.target.closest('.track'), rows = [...deck.querySelectorAll('.track')];
  const t = e.target.closest('[data-t]');
  if(t){
    if(t.dataset.t === 'play') playDeck(deck, cur);
    else { stopDeck(deck); setCue(deck, cur + (t.dataset.t === 'prev' ? -1 : 1)); }
    return;
  }
  if(e.target.closest('a.play')){ if(e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); playDeck(deck, rows.indexOf(row)); return; }
  if(e.target.closest('.cue')){ stopDeck(deck); setCue(deck, rows.indexOf(row)); }
});

function renderCards(genre){
  cardsEl.innerHTML = '';
  musicData[genre].forEach((item, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.style.setProperty('--i', i);
    const favs = item.fav && item.fav.length ? buildDeck(item.fav) : '';
    card.innerHTML = `<p class='no'>No. ${String(i+1).padStart(2,'0')}</p><h3>${esc(item.title)}</h3><span class='type'>${esc(item.type)}</span><p class='desc'>${esc(item.description)}</p>${favs}`;
    card.querySelectorAll('.deck').forEach(d => { d.dataset.artist = item.title; setCue(d, 0, true); });
    cardsEl.appendChild(card);
  });
}

let swapT = 0, swapTok = 0;
function showGenre(genre, fromHash){
  if(!musicData[genre]) genre = 'psychedelic';
  const same = genre === current && cardsEl.children.length > 0;
  current = genre;
  stage.dataset.genre = genre;
  document.querySelectorAll('.bg').forEach(b => b.classList.toggle('on', b.dataset.bg === genre));
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.genre === genre;
    t.setAttribute('aria-selected', on ? 'true' : 'false');
    t.tabIndex = on ? 0 : -1;
  });
  if(!fromHash){ try{ history.replaceState(null,'','#'+genre); }catch(e){} }
  if(same) return;
  if(!cardsEl.children.length || reduce){ renderCards(genre); sizeCanvases(); return; }
  /* fade the old cards out, swap, then ease the container to its new height */
  const tok = ++swapTok, from = cardsEl.offsetHeight;
  cardsEl.style.height = from + 'px'; cardsEl.classList.add('swap');
  clearTimeout(swapT);
  swapT = setTimeout(() => {
    if(tok !== swapTok) return;
    renderCards(genre);
    cardsEl.style.transition = 'none'; cardsEl.classList.remove('swap'); cardsEl.style.height = 'auto';
    const to = cardsEl.offsetHeight;
    cardsEl.style.height = from + 'px'; void cardsEl.offsetHeight; cardsEl.style.transition = '';
    cardsEl.style.height = to + 'px';
    clearTimeout(cardsEl._h); cardsEl._h = setTimeout(() => { if(tok === swapTok) cardsEl.style.height = ''; }, 650);
  }, 220);
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => showGenre(t.dataset.genre));
  t.addEventListener('keydown', e => {
    const tabs = [...document.querySelectorAll('.tab')]; const i = tabs.indexOf(t);
    let n = -1;
    if(e.key === 'ArrowRight') n = (i+1) % tabs.length;
    if(e.key === 'ArrowLeft') n = (i-1+tabs.length) % tabs.length;
    if(n > -1){ e.preventDefault(); tabs[n].focus(); showGenre(tabs[n].dataset.genre); }
  });
});

/* ---------- psychedelic: several ring-centres drifting, overprinted so they interfere ---------- */
const psy = document.getElementById('psyCanvas'), pc = psy.getContext('2d');
const ember = document.getElementById('emberCanvas'), ec = ember.getContext('2d');
let W = 0, H = 0, dpr = 1;
/* the canvas is sized in 240px steps, so it isn't wiped and reallocated every frame while the cards change height */
function sizeCanvases(){
  const r = stage.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(240, Math.ceil(r.height / 240) * 240), d = Math.min(window.devicePixelRatio || 1, 1.5);
  if(w === W && h === H && d === dpr) return;
  W = w; H = h; dpr = d;
  [psy, ember].forEach(c => { c.width = Math.round(W*dpr); c.height = Math.round(H*dpr); c.style.height = H + 'px'; });
  pc.setTransform(dpr,0,0,dpr,0,0); ec.setTransform(dpr,0,0,dpr,0,0);
  drawPsy(clock);          /* repaint straight away so a resize never shows a blank frame */
}
new ResizeObserver(sizeCanvases).observe(stage);

const CENTRES = [
  {c:'#1E9AAF', fx:.17, fy:.11, px:0,   py:1.2},
  {c:'#F04E7E', fx:.13, fy:.19, px:2.1, py:.4},
  {c:'#F2B416', fx:.21, fy:.15, px:4.0, py:2.6},
  {c:'#7B5CF2', fx:.09, fy:.17, px:1.0, py:3.9},
  {c:'#212A45', fx:.11, fy:.14, px:3.3, py:5.1}
];
function drawPsy(t){
  pc.globalCompositeOperation = 'source-over';
  pc.fillStyle = '#F7F1E3'; pc.fillRect(0,0,W,H);
  pc.globalCompositeOperation = 'multiply';
  pc.lineWidth = 3.6; pc.globalAlpha = .9;
  const gap = 26, maxR = Math.hypot(W,H), off = (t*16) % gap;
  CENTRES.forEach(k => {
    const x = W*(.5 + .42*Math.sin(t*k.fx + k.px)), y = H*(.5 + .4*Math.sin(t*k.fy + k.py));
    pc.strokeStyle = k.c; pc.beginPath();
    for(let r = off; r < maxR; r += gap){ pc.moveTo(x + r, y); pc.arc(x, y, r, 0, Math.PI*2); }
    pc.stroke();
  });
  pc.globalAlpha = 1; pc.globalCompositeOperation = 'source-over';
}

/* ---------- rock: embers ---------- */
class Ember{
  constructor(){ this.reset(true); }
  reset(first){
    this.x = Math.random()*W; this.y = first ? Math.random()*H : H + Math.random()*60;
    this.r = Math.random()*2 + 1; this.vy = Math.random()*.6 + .5; this.vx = Math.random()*.5 - .25;
    this.a = Math.random()*.6 + .25;
    this.col = `rgba(${230 + Math.random()*25|0}, ${70 + Math.random()*80|0}, 20, ${this.a})`;
  }
  step(){ this.y -= this.vy; this.x += this.vx + Math.sin(this.y/40)*.15; if(this.y < -10 || this.x < -10 || this.x > W + 10) this.reset(false); }
  draw(){ ec.beginPath(); ec.fillStyle = this.col; ec.arc(this.x, this.y, this.r, 0, Math.PI*2); ec.fill(); }
}
const embers = Array.from({length:150}, () => new Ember());

let last = performance.now();
function frame(now){
  const dt = Math.max(0, Math.min(.05, (now-last)/1000)); last = now;
  if(!document.hidden){
    if(current === 'psychedelic'){ clock += dt; drawPsy(clock); }
    else if(current === 'rock'){ ec.clearRect(0,0,W,H); embers.forEach(e => { e.step(); e.draw(); }); }
  }
  requestAnimationFrame(frame);
}
if(!reduce) requestAnimationFrame(frame);
initListen();

document.addEventListener('DOMContentLoaded', () => {
  const h = location.hash.replace('#','');
  showGenre(musicData[h] ? h : 'psychedelic', true);
});
if(document.readyState !== 'loading'){ const h = location.hash.replace('#',''); showGenre(musicData[h] ? h : 'psychedelic', true); }
window.addEventListener('hashchange', () => { const h = location.hash.replace('#',''); if(musicData[h]) showGenre(h, true); });
</script>
</body>
