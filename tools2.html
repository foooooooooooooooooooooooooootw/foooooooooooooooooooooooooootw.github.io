<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Self-hosted Web Video Converter</title>
<style>
  body {
    background: #1e1e2f;
    color: #eee;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    font-size: 2rem;
    margin-bottom: 1rem;
  }
  section.controls {
    background: #2a2a3d;
    padding: 15px 20px;
    border-radius: 10px;
    max-width: 600px;
    width: 100%;
  }
  label, select, input {
    display: block;
    width: 100%;
    margin: 10px 0 5px;
  }
  button {
    background: #4caf50;
    color: white;
    padding: 10px 1rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    width: 100%;
  }
  button:disabled {
    background: #666;
    cursor: not-allowed;
  }
  #progress {
    background: #444;
    border-radius: 6px;
    overflow: hidden;
    margin-top: 10px;
    height: 12px;
  }
  #bar {
    width: 0;
    height: 100%;
    background: #4caf50;
    transition: width 0.3s ease;
  }
  #log {
    margin-top: 12px;
    background: #111;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    border-radius: 6px;
    max-height: 120px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  section.preview {
    margin-top: 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }
  .video-box {
    background: #2a2a3d;
    padding: 10px;
    border-radius: 10px;
    width: 300px;
  }
  video {
    width: 100%;
    border-radius: 6px;
  }
  pre {
    background: #111;
    padding: 8px;
    margin-top: 6px;
    border-radius: 6px;
    font-size: 0.9rem;
    white-space: pre-wrap;
    color: #9f9;
  }
  a.download-link {
    display: block;
    margin-top: 12px;
    color: #4caf50;
    font-weight: bold;
    text-decoration: none;
  }
</style>
</head>
<body>

<header>🎬 Self-Hosted Web Video Converter</header>

<section class="controls">
  <input type="file" id="inputVideo" accept="video/*" />
  
  <label for="codec">Video Codec</label>
  <select id="codec">
    <option value="libx264">H.264 (MP4)</option>
    <option value="libx265">H.265 (MP4)</option>
    <option value="vp9">VP9 (WebM)</option>
    <option value="libvpx">VP8 (WebM)</option>
    <option value="libaom-av1">AV1 (WebM)</option>
  </select>
  
  <label for="framerate">Framerate (fps)</label>
  <input type="number" id="framerate" value="30" min="1" max="120" />
  
  <label for="audioBitrate">Audio Bitrate (kbps)</label>
  <input type="number" id="audioBitrate" value="128" min="16" max="512" />
  
  <label for="qualityMode">Quality Mode</label>
  <select id="qualityMode">
    <option value="bitrate">Bitrate (CBR)</option>
    <option value="cq">Constant Quality (CRF)</option>
  </select>
  
  <div id="bitrateInputs">
    <label for="bitrate">Video Bitrate (kbps)</label>
    <input type="number" id="bitrate" value="1000" min="100" max="10000" />
  </div>
  
  <div id="cqInputs" style="display:none;">
    <label for="cq">CRF (Lower = Better Quality)</label>
    <input type="number" id="cq" value="28" min="0" max="51" />
  </div>

  <button id="convertBtn" disabled>Convert Video</button>

  <div id="progress">
    <div id="bar"></div>
  </div>
  <div id="log">Ready.</div>
</section>

<section class="preview">
  <div class="video-box">
    <h3>Input Video</h3>
    <video id="inputPreview" controls></video>
    <pre id="inputMeta"></pre>
  </div>
  <div class="video-box">
    <h3>Converted Video</h3>
    <video id="outputPreview" controls></video>
    <pre id="outputMeta"></pre>
    <a href="#" id="downloadLink" class="download-link" style="display:none;" download>⬇ Download Converted Video</a>
  </div>
</section>

<!-- Load ffmpeg UMD and core locally -->
<script defer src="util/ffmpeg.js"></script>
<script defer src="util/main.js"></script>

<script>
  // Toggle bitrate / cq input visibility
  const qualityModeEl = document.getElementById('qualityMode');
  qualityModeEl.addEventListener('change', () => {
    const mode = qualityModeEl.value;
    document.getElementById('bitrateInputs').style.display = mode === 'bitrate' ? 'block' : 'none';
    document.getElementById('cqInputs').style.display = mode === 'cq' ? 'block' : 'none';
  });
</script>

</body>
</html>
