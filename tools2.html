<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #1e1e2f;
      color: #eee;
    }

    header {
      padding: 20px;
      background: #2a2a3d;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      color: #fff;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      gap: 20px;
    }

    section.controls {
      background: #2a2a3d;
      padding: 20px;
      border-radius: 10px;
      max-width: 600px;
      width: 100%;
    }

    section.controls label, section.controls select, section.controls input {
      display: block;
      margin: 10px 0;
      width: 100%;
    }

    section.preview {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }

    .video-box {
      background: #2a2a3d;
      border-radius: 10px;
      padding: 10px;
      width: 300px;
      text-align: center;
    }

    .video-box video {
      width: 100%;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .video-box pre {
      font-size: 12px;
      text-align: left;
      color: #9f9;
      white-space: pre-wrap;
      background: #111;
      padding: 10px;
      border-radius: 5px;
    }

    #progress {
      width: 100%;
      max-width: 600px;
      height: 10px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
    }

    #bar {
      width: 0%;
      height: 100%;
      background: #4caf50;
      transition: width 0.3s;
    }

    button {
      background: #4caf50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #3e9440;
    }
  </style>
</head>
<body>
  <header>🎥 Web Video Converter</header>

  <main>
    <section class="controls">
      <input type="file" id="inputVideo" accept="video/*">

      <label>Codec:</label>
      <select id="codec">
        <option value="vp9">VP9 (WebM)</option>
        <option value="libx265">H.265 (MP4)</option>
        <option value="libx264">H.264 (MP4)</option>
        <option value="libvpx">VP8 (WebM)</option>
        <option value="libaom-av1">AV1 (WebM)</option>
      </select>

      <label>Framerate:</label>
      <input type="number" id="framerate" value="30">

      <label>Audio Bitrate (kbps):</label>
      <input type="number" id="audioBitrate" value="128">

      <label>Quality Mode:</label>
      <select id="qualityMode">
        <option value="bitrate">Bitrate (CBR)</option>
        <option value="cq">Constant Quality (CRF/CQ)</option>
      </select>

      <div id="bitrateInputs">
        <label>Bitrate (kbps):</label>
        <input type="number" id="bitrate" value="1000">
      </div>

      <div id="cqInputs" style="display:none">
        <label>Constant Quality (Lower = Better):</label>
        <input type="number" id="cq" value="28" min="1" max="63">
      </div>

      <button id="convertBtn">Convert Video</button>
      <div id="progress"><div id="bar"></div></div>
    </section>

    <section class="preview">
      <div class="video-box">
        <h3>📥 Original</h3>
        <video id="inputPreview" controls></video>
        <pre id="inputMeta"></pre>
      </div>
      <div class="video-box">
        <h3>📤 Converted</h3>
        <video id="outputPreview" controls></video>
        <pre id="outputMeta"></pre>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.4/dist/ffmpeg.min.js"></script>
  <script src="util/main.js"></script>

</body>
</html>
