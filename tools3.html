<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Converter + Background Remover</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      color: #fff;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 600px;
      color: #1a1a1a;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 2rem;
      font-size: 1.1rem;
      font-weight: 400;
    }

    #drop-zone {
      border: 3px dashed #d1d5db;
      background: linear-gradient(145deg, #f8fafc, #f1f5f9);
      border-radius: 16px;
      padding: 3rem 2rem;
      text-align: center;
      margin-bottom: 2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    #drop-zone::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, transparent, rgba(102, 126, 234, 0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #drop-zone:hover {
      border-color: #667eea;
      background: linear-gradient(145deg, #f0f4ff, #e5edff);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.15);
    }

    #drop-zone:hover::before {
      opacity: 1;
    }

    .drop-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: block;
      opacity: 0.6;
    }

    .drop-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 0.5rem;
    }

    .drop-subtext {
      font-size: 0.9rem;
      color: #9ca3af;
    }

    .canvas-wrapper {
      position: relative;
      margin-bottom: 2rem;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      background: #f8fafc;
    }

    .checkerboard {
      background-image: 
        linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      cursor: crosshair;
      transition: transform 0.2s ease;
    }

    canvas:hover {
      transform: scale(1.02);
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #4b5563;
    }

    select {
      padding: 0.75rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      background: white;
      color: #1f2937;
      transition: all 0.3s ease;
      outline: none;
      cursor: pointer;
    }

    select:hover {
      border-color: #667eea;
    }

    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      padding: 0.75rem 2rem;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    #file-input {
      display: none;
    }

    .info-card {
      background: linear-gradient(135deg, #f0f4ff, #e5edff);
      border: 1px solid rgba(102, 126, 234, 0.2);
      border-radius: 12px;
      padding: 1rem;
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .info-icon {
      font-size: 1.5rem;
      opacity: 0.8;
    }

    .info-text {
      font-size: 0.9rem;
      color: #4b5563;
      font-weight: 500;
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @media (max-width: 640px) {
      .container {
        padding: 1.5rem;
        margin: 1rem;
      }
      
      h1 {
        font-size: 2rem;
      }
      
      .controls {
        flex-direction: column;
        align-items: stretch;
      }
      
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Image Converter</h1>
  <p class="subtitle">Convert images and remove backgrounds with ease</p>

  <div id="drop-zone">
    <div class="drop-icon">🖼️</div>
    <div class="drop-text">Drop your image here</div>
    <div class="drop-subtext">or click to browse files</div>
  </div>
  
  <input type="file" id="file-input" accept="image/*">

  <div class="canvas-wrapper checkerboard">
    <canvas id="canvas"></canvas>
  </div>

  <div class="controls">
    <div class="control-group">
      <label for="format">Export Format</label>
      <select id="format">
        <option value="image/png">PNG (Transparent)</option>
        <option value="image/jpeg">JPEG</option>
        <option value="image/webp">WebP</option>
        <option value="bmp">BMP</option>
      </select>
    </div>
    <button id="download-btn">Download Image</button>
  </div>

  <div class="info-card">
    <div class="info-icon">💡</div>
    <div class="info-text">Click anywhere on the image to remove similar background colors</div>
  </div>
</div>

<script>
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const formatSelect = document.getElementById('format');
const downloadBtn = document.getElementById('download-btn');

let imgData = null;

// --- Load Image ---
function loadImage(file) {
  dropZone.classList.add('loading');
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);
      imgData = ctx.getImageData(0, 0, img.width, img.height);
      dropZone.classList.remove('loading');
      
      // Update drop zone to show success
      dropZone.innerHTML = `
        <div class="drop-icon">✅</div>
        <div class="drop-text">Image loaded successfully</div>
        <div class="drop-subtext">Click to load a different image</div>
      `;
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

dropZone.onclick = () => fileInput.click();
fileInput.onchange = () => {
  if (fileInput.files[0]) loadImage(fileInput.files[0]);
};

dropZone.ondragover = e => {
  e.preventDefault();
  dropZone.style.borderColor = '#667eea';
  dropZone.style.background = 'linear-gradient(145deg, #f0f4ff, #e5edff)';
};

dropZone.ondragleave = () => {
  dropZone.style.borderColor = '#d1d5db';
  dropZone.style.background = 'linear-gradient(145deg, #f8fafc, #f1f5f9)';
};

dropZone.ondrop = e => {
  e.preventDefault();
  dropZone.style.borderColor = '#d1d5db';
  dropZone.style.background = 'linear-gradient(145deg, #f8fafc, #f1f5f9)';
  if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
};

// --- Background Removal ---
canvas.onclick = (e) => {
  if (!imgData) return;
  
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) * canvas.width / rect.width);
  const y = Math.floor((e.clientY - rect.top) * canvas.height / rect.height);
  const i = (y * canvas.width + x) * 4;
  const keyColor = [
    imgData.data[i],
    imgData.data[i + 1],
    imgData.data[i + 2]
  ];
  const threshold = 40;

  const d = new Uint8ClampedArray(imgData.data);
  for (let j = 0; j < d.length; j += 4) {
    const dr = d[j] - keyColor[0];
    const dg = d[j + 1] - keyColor[1];
    const db = d[j + 2] - keyColor[2];
    const distance = Math.sqrt(dr * dr + dg * dg + db * db);
    if (distance < threshold) {
      d[j + 3] = 0; // Transparent
    }
  }

  const newImageData = new ImageData(d, canvas.width, canvas.height);
  ctx.putImageData(newImageData, 0, 0);
  
  // Visual feedback
  canvas.style.transform = 'scale(0.98)';
  setTimeout(() => {
    canvas.style.transform = 'scale(1)';
  }, 150);
};

// --- BMP Export ---
function exportBMP(canvas) {
  const width = canvas.width;
  const height = canvas.height;
  const ctx = canvas.getContext("2d");
  const imageData = ctx.getImageData(0, 0, width, height);
  const pixels = imageData.data;

  const rowSize = Math.floor((24 * width + 31) / 32) * 4;
  const pixelArraySize = rowSize * height;
  const fileSize = 54 + pixelArraySize;

  const buffer = new ArrayBuffer(fileSize);
  const view = new DataView(buffer);

  let offset = 0;
  view.setUint8(offset++, 0x42); // 'B'
  view.setUint8(offset++, 0x4D); // 'M'
  view.setUint32(offset, fileSize, true); offset += 4;
  view.setUint32(offset, 0, true); offset += 4;
  view.setUint32(offset, 54, true); offset += 4;

  view.setUint32(offset, 40, true); offset += 4;
  view.setInt32(offset, width, true); offset += 4;
  view.setInt32(offset, -height, true); offset += 4;
  view.setUint16(offset, 1, true); offset += 2;
  view.setUint16(offset, 24, true); offset += 2;
  view.setUint32(offset, 0, true); offset += 4;
  view.setUint32(offset, pixelArraySize, true); offset += 4;
  view.setInt32(offset, 2835, true); offset += 4;
  view.setInt32(offset, 2835, true); offset += 4;
  view.setUint32(offset, 0, true); offset += 4;
  view.setUint32(offset, 0, true); offset += 4;

  let p = 54;
  for (let y = 0; y < height; y++) {
    let rowStart = y * width * 4;
    for (let x = 0; x < width; x++) {
      let i = rowStart + x * 4;
      view.setUint8(p++, pixels[i + 2]); // B
      view.setUint8(p++, pixels[i + 1]); // G
      view.setUint8(p++, pixels[i]);     // R
    }
    while ((p - 54) % rowSize !== 0) view.setUint8(p++, 0);
  }

  return new Blob([buffer], { type: "image/bmp" });
}

// --- Download Handler ---
downloadBtn.onclick = () => {
  if (!imgData) return;
  
  downloadBtn.textContent = 'Downloading...';
  downloadBtn.classList.add('pulse');
  
  const type = formatSelect.value;
  let blob;
  
  if (type === 'bmp') {
    blob = exportBMP(canvas);
  } else {
    const dataURL = canvas.toDataURL(type);
    const byteString = atob(dataURL.split(',')[1]);
    const mime = dataURL.split(',')[0].split(':')[1].split(';')[0];
    const buffer = new ArrayBuffer(byteString.length);
    const uints = new Uint8Array(buffer);
    for (let i = 0; i < byteString.length; i++) {
      uints[i] = byteString.charCodeAt(i);
    }
    blob = new Blob([buffer], { type: mime });
  }

  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "converted." + (
    type === "image/png" ? "png" :
    type === "image/jpeg" ? "jpg" :
    type === "image/webp" ? "webp" : "bmp"
  );
  a.click();
  
  setTimeout(() => {
    downloadBtn.textContent = 'Download Image';
    downloadBtn.classList.remove('pulse');
  }, 1000);
};
</script>

</body>
</html>
